# The collaboration server with Postgres. Files (snapshots, imported bodies) go to the `storage` volume.
#   cp deploy/.env.example deploy/.env   # then edit it
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# This runs the published image (OSWX_COLLAB_VERSION, default latest). To build from this checkout instead,
# add -f deploy/docker-compose.build.yml.
# Put a TLS-terminating proxy in front (see docs/self-hosting.md); the server itself speaks plain HTTP.
services:
  server:
    image: ghcr.io/dukeofcheese/openswx-collab-server:${OSWX_COLLAB_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OSWX_COLLAB_DATABASE_URL: postgresql+asyncpg://collab:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db/collab
      OSWX_COLLAB_STORAGE_URL: /data/storage
      OSWX_COLLAB_PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      OSWX_COLLAB_OPEN_REGISTRATION: ${OPEN_REGISTRATION:-false}
      OSWX_COLLAB_SMTP_HOST: ${SMTP_HOST:-}
      OSWX_COLLAB_SMTP_PORT: ${SMTP_PORT:-587}
      OSWX_COLLAB_SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      OSWX_COLLAB_SMTP_USER: ${SMTP_USER:-}
      OSWX_COLLAB_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      OSWX_COLLAB_SMTP_FROM: ${SMTP_FROM:-}
      OSWX_COLLAB_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OSWX_COLLAB_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OSWX_COLLAB_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      OSWX_COLLAB_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # The TLS proxy on the host reaches the server through the published port, so its connections
      # come from this network's gateway. The Rust server (docker-compose.rust.yml) believes the client
      # address the proxy appends to X-Forwarded-For only from this network. The Python server this
      # file runs does not read the setting: it believes X-Forwarded-For only from 127.0.0.1, so here
      # every client shares the gateway's address for its sign-in limit (docs/self-hosting.md).
      OSWX_COLLAB_TRUSTED_PROXIES: ${NETWORK_SUBNET:-172.30.87.0/24}
    volumes:
      - storage:/data
    ports:
      - "127.0.0.1:${HOST_PORT:-8787}:8787"  # only this machine: put a TLS proxy in front

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: collab
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab"]
      interval: 5s
      timeout: 3s
      retries: 20

# A fixed subnet, so that the server can be told which addresses are its proxy's (above). Change
# NETWORK_SUBNET in deploy/.env if it overlaps a network this machine already has.
networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.30.87.0/24}

volumes:
  storage:
  db:
