[workspace]
resolver = "3"
members = ["crates/core", "crates/loadgen", "crates/server", "crates/serverd"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
async-trait = "0.1"
# The Astral fork of async_zip: its streamed entries end with a correct ZIP64 data descriptor.
async_zip = { package = "astral_async_zip", version = "0.0.24", default-features = false, features = ["deflate-write", "tokio"] }
base64 = "0.22"
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hdrhistogram = "7"
http-body-util = "0.1"
hex = "0.4"
# The serving loop is hyper's own (axum's `serve` has no time limits); these are the versions axum uses.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# S3-compatible storage only; 0.12 shares the workspace's reqwest 0.12 and ring (no second TLS stack).
object_store = { version = "0.12", default-features = false, features = ["aws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
# A mail server that speaks TLS, for the mail tests (dev-dependencies only).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
imbl = "7"
rmpv = "1"
# Reads a password from the terminal without showing it (`create-admin`, `reset-password`).
rpassword = "7"
# An in-process S3 server for the storage tests (dev-dependencies only).
s3s = "0.17"
s3s-fs = "0.17"
thiserror = "2"
tower-http = { version = "0.6", default-features = false, features = ["catch-panic"] }
tower-service = "0.3"
serde_json = "1"
proptest = "1"
rand = "0.9"
# Makes a certificate authority and a certificate for the mail tests (dev-dependencies only).
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# The machine's trust store, for the mail server's certificate (already used by object_store).
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-native-certs = "0.8"
scrypt = "0.11"
sha2 = "0.10"
subtle = "2"
bytes = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
zstd = "0.14"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "macros", "derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# scrypt at N=2^15 takes seconds unoptimised; tests hash passwords.
# Incremental compilation is off: with some thirty test binaries its cache grew past 30 GB.
[profile.dev]
incremental = false

[profile.dev.package.scrypt]
opt-level = 3

# Blob uploads hash and compress up to 256 MB; tests upload tens of megabytes.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.zstd-sys]
opt-level = 3

# An organisation export deflates every blob (and its tests inflate them again).
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3
