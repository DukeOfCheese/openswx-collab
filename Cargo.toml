[workspace]
resolver = "3"
members = ["crates/core", "crates/loadgen", "crates/server"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hdrhistogram = "7"
http-body-util = "0.1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
imbl = "7"
rmpv = "1"
thiserror = "2"
serde_json = "1"
proptest = "1"
rand = "0.9"
scrypt = "0.11"
sha2 = "0.10"
subtle = "2"
bytes = "1"
tempfile = "3"
tracing = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "macros", "derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# scrypt at N=2^15 takes seconds unoptimised; tests hash passwords.
[profile.dev.package.scrypt]
opt-level = 3
