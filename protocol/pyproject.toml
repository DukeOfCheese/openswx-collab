[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openswx-collab-protocol"
version = "0.1.0"
description = "Wire protocol and document operations shared by the openswx collaboration server and client"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic>=2.6"]

[tool.setuptools]
packages = ["openswx_collab_protocol"]
