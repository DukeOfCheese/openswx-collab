[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openswx-collab-protocol"
version = "0.1.1"
description = "Wire protocol and document operations shared by the openswx collaboration server and client"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "the openswx authors" }]
keywords = ["cad", "collaboration", "real-time", "openswx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pydantic>=2.6"]

[project.urls]
Homepage = "https://github.com/DukeOfCheese/openswx-collab"
Documentation = "https://github.com/DukeOfCheese/openswx-collab/tree/main/docs"
Issues = "https://github.com/DukeOfCheese/openswx-collab/issues"

[tool.setuptools]
packages = ["openswx_collab_protocol"]
