name: rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  deny:
    # Advisories, licences, duplicate versions and sources of the Rust dependencies (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@bb119f768ea239e765aeaef5769558d4f21213aa  # v2.1.5
        with:
          command: check
          command-arguments: --warn unmaintained

  postgres:
    # the server's suite again, on PostgreSQL (every test in a schema of its own, dropped when it ends)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab
          POSTGRES_DB: collab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collab" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (PostgreSQL 16)
        env:
          OSWX_TEST_DATABASE_URL: postgres://collab:collab@127.0.0.1:5432/collab
        # Four tests at a time: each test server holds up to six connections (and a test may start
        # two servers), well inside the service's default max_connections of 100.
        run: cargo test -p oswx-server --no-fail-fast -- --test-threads=4

  s3:
    # The storage tests again, with every test server keeping its files in a real S3-compatible
    # store: Garage, the store of deploy/docker-compose.s3.yml, started as that file starts it.
    # (Everywhere else these tests run against an S3 server inside the test process.)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Garage
        run: |
          # (The key as Garage's quick start makes it; Garage takes any id of 8 characters or more.)
          access_key="GK$(openssl rand -hex 16)"
          secret_key="$(openssl rand -hex 32)"
          docker run -d --name garage -p 127.0.0.1:3900:3900 \
            -e GARAGE_RPC_SECRET="$(openssl rand -hex 32)" \
            -e GARAGE_DEFAULT_ACCESS_KEY="$access_key" \
            -e GARAGE_DEFAULT_SECRET_KEY="$secret_key" \
            -e GARAGE_DEFAULT_BUCKET=oswx-test \
            -v "$PWD/deploy/garage.toml:/etc/garage.toml:ro" \
            dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5 \
            /garage server --single-node --default-bucket
          {
            echo "OSWX_TEST_S3_ACCESS_KEY=$access_key"
            echo "OSWX_TEST_S3_SECRET_KEY=$secret_key"
          } >> "$GITHUB_ENV"
          # Ready when a signed listing of the test bucket answers 200: Garage is up, and the key
          # and the bucket exist.
          for _ in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              --aws-sigv4 "aws:amz:garage:s3" --user "$access_key:$secret_key" \
              http://127.0.0.1:3900/oswx-test || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "Garage did not list the test bucket within a minute (last answer: $status)"
          docker logs garage
          exit 1
      - name: Test (S3 storage on Garage)
        env:
          OSWX_TEST_STORAGE: s3
          OSWX_TEST_S3_URL: http://127.0.0.1:3900
          OSWX_TEST_S3_BUCKET: oswx-test
          OSWX_TEST_S3_REGION: garage
        run: >-
          cargo test -p oswx-server --no-fail-fast
          --test storage_s3 --test storage --test documents --test lifecycle
          --test journal --test pipeline --test live
      - name: Garage's log
        if: failure()
        run: docker logs garage

  deploy:
    # The Rust server's image and Compose files: built and run (SQLite; PostgreSQL; PostgreSQL + Garage),
    # used over REST and the WebSocket, restarted, and taken down again.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pyyaml websockets
      - run: python tools/check_deploy_rust.py --docker
