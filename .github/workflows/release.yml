# A release, on a version tag (v*). The tag picks the line:
#   v0.1.*  the Python server (0.1.x): the Python packages (PyPI), the Python image (with `latest`) and the
#           GitHub release; the jobs `packages`, `pypi-*`, `image` and `github-release`, as before.
#   other   the Rust server (0.2 and later): binaries for five targets, the image (tags `<version>` and
#           `<major>.<minor>` only, never `latest`) and the GitHub release; the jobs `rust-*`.
#
#   python tools/release_notes.py 0.2.0      # check the CHANGELOG section first
#   git tag -a v0.2.0 -m "openswx-collab 0.2.0" && git push origin v0.2.0
#
# PyPI publishing uses trusted publishing (no stored token) and is skipped until it is set up:
#   1. On pypi.org: Account -> Publishing -> Add a new pending publisher, once per project, owner
#      "DukeOfCheese", repository "openswx-collab", workflow "release.yml", and the environment:
#        project "openswx-collab-protocol"  environment "pypi"
#        project "openswx-collab-server"    environment "pypi-server"
#      (PyPI allows one pending publisher per repository + workflow + environment, hence two environments.)
#   2. On GitHub: the environments "pypi" and "pypi-server" (Settings -> Environments) and the repository
#      variable PYPI_PUBLISH = true (Settings -> Secrets and variables -> Actions -> Variables).
# Both images go to ghcr.io/dukeofcheese/openswx-collab-server with the GitHub token; nothing to set up.
# Everything except publishing also runs by hand from the Actions tab (both lines), so a broken build
# shows before a tag. CONTRIBUTING.md ("Releasing") has the steps.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- The Python server (0.1.x): a v0.1.* tag, or a run by hand ----

  packages:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/v0.1.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build protocol --outdir dist
          python -m build server --outdir dist
          python -m twine check --strict dist/*
      - name: The tag matches every version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for p in protocol server; do
            v=$(python -c "import tomllib; print(tomllib.load(open('$p/pyproject.toml','rb'))['project']['version'])")
            test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but $p/pyproject.toml says $v"; exit 1; }
          done
      - name: The wheels install from nothing and the server starts
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp
          /tmp/v/bin/python -c "import openswx_collab_protocol as p, openswx_collab_server as s; print(p.__version__, s.__version__)"
          OSWX_COLLAB_DATABASE_URL=sqlite+aiosqlite:////tmp/r.db OSWX_COLLAB_STORAGE_URL=/tmp/files \
            /tmp/v/bin/openswx-collab-server serve --port 8787 & pid=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/server && break; sleep 1; done
          kill $pid
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/

  pypi-protocol:
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v0.1.') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openswx-collab-protocol/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-packages
          path: dist/
      - run: mkdir up && mv dist/openswx_collab_protocol-* up/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: up/

  pypi-server:
    needs: pypi-protocol  # (the server's wheel needs the protocol on PyPI to install)
    runs-on: ubuntu-latest
    environment:
      name: pypi-server
      url: https://pypi.org/project/openswx-collab-server/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-packages
          path: dist/
      - run: mkdir up && mv dist/openswx_collab_server-* up/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: up/

  image:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/v0.1.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dukeofcheese/openswx-collab-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=openswx-collab-server
            org.opencontainers.image.description=Self-hostable live collaboration server for openswx
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [packages, image]
    if: startsWith(github.ref, 'refs/tags/v0.1.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: python-packages
          path: dist/
      - name: Release with the changelog section as its notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/release_notes.py "${GITHUB_REF_NAME}" > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "openswx-collab ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

  # ---- The Rust server (0.2 and later): any other v* tag, or a run by hand ----
  # Publishing (the image's push, the GitHub release) happens only on a tag push.

  rust-check:
    if: ${{ !startsWith(github.ref, 'refs/tags/v0.1.') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: The version (the tag matches both crates)
        id: version
        run: |
          read_version() {
            python3 -c "import tomllib, sys; print(tomllib.load(open(sys.argv[1], 'rb'))['package']['version'])" "$1"
          }
          server=$(read_version crates/server/Cargo.toml)
          serverd=$(read_version crates/serverd/Cargo.toml)
          test "$server" = "$serverd" || { echo "crates/server says $server but crates/serverd says $serverd"; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            test "v$server" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but the crates say $server"; exit 1; }
          fi
          echo "version=$server" >> "$GITHUB_OUTPUT"
      - name: The CHANGELOG has the version's section
        if: github.event_name == 'push'
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME}" > /dev/null

  rust-binaries:
    needs: rust-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.rust-check.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: musl-gcc (ring, zstd and SQLite compile C)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          # For the target's C code only; build scripts still use the runner's own compiler.
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p oswx-serverd --target "$TARGET"
      - name: The binary runs
        run: |
          exe=""
          if [ "${RUNNER_OS}" = Windows ]; then exe=".exe"; fi
          bin="target/$TARGET/release/openswx-collab-server$exe"
          "$bin" --version | tee version.txt
          grep -qF "$VERSION" version.txt
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: Static, and it serves (Linux)
        if: runner.os == 'Linux'
        run: |
          file "$BIN" | tee file.txt
          grep -Eq 'statically linked|static-pie linked' file.txt
          d="$RUNNER_TEMP/smoke"
          mkdir -p "$d"
          OSWX_COLLAB_DATABASE_URL="sqlite://$d/collab.db" OSWX_COLLAB_STORAGE_URL="$d/storage" \
            OSWX_COLLAB_PUBLIC_URL=http://127.0.0.1:8787 "$BIN" serve --port 8787 & pid=$!
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health; then ok=1; break; fi
            sleep 1
          done
          kill "$pid"
          wait "$pid" || true
          test -n "$ok" || { echo "no answer from /api/health within 30 s"; exit 1; }
      - name: Archive and checksum
        run: |
          name="openswx-collab-server-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "$BIN" LICENSE NOTICE README.md "dist/$name/"
          cd dist
          if [ "${RUNNER_OS}" = Windows ]; then
            archive="$name.zip"
            7z a -tzip "$archive" "$name" > /dev/null
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  rust-image:
    # Each architecture built on its own kind of machine (no emulation) and pushed by digest; the
    # manifest list that names both is made in rust-image-manifest.
    needs: rust-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dukeofcheese/openswx-collab-server
          labels: |
            org.opencontainers.image.title=openswx-collab-server
            org.opencontainers.image.description=Self-hostable live collaboration server for openswx
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.rust
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/dukeofcheese/openswx-collab-server,push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=rust-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rust-image-${{ matrix.arch }}
      - name: Keep the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  rust-image-manifest:
    needs: [rust-check, rust-image]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v0.1.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dukeofcheese/openswx-collab-server
          # `latest` stays on the Python server's image (0.1.x) until openswx's client speaks protocol 2.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: The tags are version tags only
        run: |
          tags=$(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "$tags"
          test -n "$tags" || { echo "no tags"; exit 1; }
          if grep -q ':latest$' <<< "$tags"; then echo "a Rust release never moves latest"; exit 1; fi
      - name: One manifest list for both architectures
        working-directory: digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/dukeofcheese/openswx-collab-server@sha256:%s ' *)
          docker buildx imagetools inspect "ghcr.io/dukeofcheese/openswx-collab-server:$VERSION"

  rust-release:
    needs: [rust-check, rust-binaries, rust-image-manifest]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v0.1.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: Release with the changelog section as its notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/release_notes.py "${GITHUB_REF_NAME}" > notes.md
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --title "openswx-collab ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --verify-tag $pre
