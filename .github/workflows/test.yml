# The test suite on every push and pull request: SQLite on three systems, PostgreSQL, and the Docker stack.
name: test

on:
  push:
    branches: [main]   # (branches are tested through their pull request: not twice)
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"   # the oldest supported version (requires-python in the pyproject files)
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: macos-15
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: "*/pyproject.toml"
      - name: Install
        run: python -m pip install -e protocol -e "server[dev,s3]" "moto[s3]"
      - name: Errors only (syntax, undefined names)
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 protocol server tests tools
      - name: Test (SQLite, files in a folder and in a fake S3)
        run: python -m pytest -q --durations=15

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab
          POSTGRES_DB: collab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collab" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "*/pyproject.toml"
      - name: Install
        run: python -m pip install -e protocol -e "server[dev,postgres,s3]" "moto[s3]"
      - name: Test (PostgreSQL; the database is wiped before each test)
        env:
          OSWX_TEST_DATABASE_URL: postgresql+asyncpg://collab:collab@127.0.0.1:5432/collab
        run: python -m pytest -q --durations=15

  docker:
    # the image and the Compose stack as a self-hoster runs them, with files in Garage (S3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Settings
        run: |
          {
            echo "PUBLIC_URL=http://127.0.0.1:8787"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "S3_ACCESS_KEY=GK$(openssl rand -hex 16)"
            echo "S3_SECRET_KEY=$(openssl rand -hex 32)"
            echo "GARAGE_RPC_SECRET=$(openssl rand -hex 32)"
          } > deploy/.env
      - name: Build and start
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.s3.yml --env-file deploy/.env up -d --build --wait --wait-timeout 180
      - name: The server answers, signs someone up and stores a document in the bucket
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8787
          curl -fsS $base/api/server | grep -q '"registration":"first_user"'
          token=$(curl -fsS $base/api/auth/register -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"correct horse","name":"CI"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          auth="authorization: Bearer $token"
          org=$(curl -fsS $base/api/orgs -H "$auth" -H 'content-type: application/json' -d '{"name":"CI"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          project=$(curl -fsS $base/api/orgs/$org/projects -H "$auth" -H 'content-type: application/json' -d '{"name":"P"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          doc=$(curl -fsS $base/api/projects/$project/documents -H "$auth" -H 'content-type: application/json' \
            -d '{"name":"Part","content":{"version":3,"features":[]}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.s3.yml --env-file deploy/.env restart server
          for i in $(seq 1 30); do curl -fsS $base/api/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS "$base/api/documents/$doc/content" -H "$auth" | grep -q '"features":\[\]'
      - name: Logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.s3.yml --env-file deploy/.env logs --tail 80
