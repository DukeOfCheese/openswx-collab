# Issue and pull request labels, kept in step with openswx's (.github/labels.yml there). Create or update
# them on GitHub with openswx's tool, pointed at this repository:
#   python ../openswx/tools/sync_labels.py     (needs the GitHub CLI, `gh`, signed in; run from this repository)
# Type
- {name: bug, color: d73a4a, description: "Wrong result, error or crash"}
- {name: feature, color: a2eeef, description: "Something the server or protocol should do"}
- {name: docs, color: 0075ca, description: "Documentation"}
- {name: question, color: d876e3, description: "Needs an answer, not a change"}
# Area
- {name: "area:protocol", color: ededed, description: "Operations and messages shared with the openswx client"}
- {name: "area:sync", color: ededed, description: "Ordering, conflicts, locks, reconnects, presence"}
- {name: "area:history", color: ededed, description: "Undo, versions, restore, snapshots"}
- {name: "area:assembly", color: ededed, description: "Assemblies and references to parts"}
- {name: "area:accounts", color: ededed, description: "Sign-in, organisations, invites, roles"}
- {name: "area:storage", color: ededed, description: "Database and file storage"}
- {name: "area:deploy", color: ededed, description: "Docker, Compose, self-hosting, CI"}
# Priority
- {name: P0, color: b60205, description: "Data loss, crash or security"}
- {name: P1, color: d93f0b, description: "Wrong result, or blocks common work"}
- {name: P2, color: fbca04, description: "A workaround exists"}
- {name: P3, color: 0e8a16, description: "Polish"}
# Status
- {name: needs-repro, color: fef2c0, description: "Needs a reproduction before work can start"}
- {name: confirmed, color: bfdadc, description: "Reproduced"}
- {name: in-progress, color: 1d76db, description: "Someone is working on it"}
- {name: blocked, color: 000000, description: "Waiting on something else"}
# Help
- {name: good first issue, color: 7057ff, description: "Small and well specified"}
- {name: help wanted, color: 008672, description: "Contributions welcome"}
